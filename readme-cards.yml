name: Render README cards

on:
  schedule:
    - cron: "17 1 * * *"   # every morning, 06:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/readme-cards.yml"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch contribution data
        env:
          # Optional: add a personal token as the PROFILE_TOKEN secret to count private contributions.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: python scripts/fetch_data.py

      - name: Render README cards (hero, tiles, skills, activity, graph, repos)
        run: python scripts/render_readme_cards.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets data
          git diff --cached --quiet || git commit -m "chore: refresh README cards"
          git push
